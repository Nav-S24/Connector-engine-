name: Connector Platform CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate connector YAML configs
        run: |
          connector validate connectors/paystub.yaml
          connector validate connectors/gitlike.yaml
          connector validate connectors/sheetsy.yaml

      - name: Run pytest suite with coverage
        run: |
          pytest -v --cov=connector --cov-report=term-missing

      - name: Run offline AI layer evaluation scenarios
        run: |
          python -m benchmarks.eval_ai_layer --output /tmp/eval_results.md
